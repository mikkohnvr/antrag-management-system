<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parteitag Antragsmanagement</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="img/favicon-32x32.png" rel="icon" type="image/png">
</head>
<body>
<header>
    <div class="logo">
        <a href=".">
            <img src="img/header.png" alt="Header Image" style="height: 80px;">
        </a>
    </div>
    <nav>
        <ul>
            <li><a href="#" id="nav-antraege"><i class="fas fa-list"></i> Anträge</a></li>
            <li><a href="#" id="nav-live"><i class="fas fa-tv"></i> Live</a></li>
            <li><a href="#" id="nav-admin" class="button"><i class="fas fa-lock"></i> Admin</a></li>
        </ul>
    </nav>
</header>

<div id="connection-lost-popup" class="connection-popup hidden">
    <div class="connection-popup-content">
        <h3>Verbindung verloren!</h3>
        <p>Versuche die Verbindung wieder herzustellen... <span id="reconnect-attempt">0</span>/<span id="max-reconnect">5</span></p>
        <div class="connection-progress"></div>
        <button id="reload-page" class="button">Seite neu laden</button>
    </div>
</div>

<main class="container">
    <div id="page-antraege">
        <img src="img/antragsuebersicht.png" alt="Antragsübersicht" style="max-width: 30%; height: auto;">
        <ul class="antragsliste" id="antragsliste">
        </ul>
    </div>

    <div id="page-live" class="hidden">
        <img src="img/live-slideshow.png" alt="Live Slideshow" style="max-width: 30%; height: auto; margin-bottom: 10px">
        <div class="slideshow-container">
            <div id="current-slide" class="slide">
                <h2 class="slide-title">Kein aktiver Antrag</h2>
                <p>Warten auf Präsentation...</p>
            </div>
        </div>
    </div>

    <div id="page-admin" class="hidden">
        <h1 class="page-title">
            <i class="fas fa-lock"></i>
            Admin Panel
        </h1>
        <div class="admin-panel">
            <div class="admin-controls">
                <button id="prev-slide" class="button"><i class="fas fa-arrow-left"></i> Vorheriger</button>
                <button id="next-slide" class="button"><i class="fas fa-arrow-right"></i> Nächster</button>
                <button id="show-live" class="button"><i class="fas fa-tv"></i> Live anzeigen</button>
                <button id="export-btn" class="button">Export Anträge</button>
                <label for="import-file" class="button" style="margin-bottom: 0 !important;">
                    Import Anträge
                    <input type="file" id="import-file" accept=".json" style="display: none;">
                </label>
            </div>
            <h3>Anträge verwalten</h3>
            <div class="admin-list" id="admin-antragsliste">
            </div>
            <h3 class="mt-3">Neuen Antrag erstellen</h3>
            <div class="form-group">
                <label for="antrag-titel">Antragstitel</label>
                <input type="text" id="antrag-titel" placeholder="Titel des Antrags">
            </div>
            <div class="form-group">
                <label for="antrag-beschreibung">Beschreibung</label>
                <textarea id="antrag-beschreibung" placeholder="Ausführliche Beschreibung des Antrags"></textarea>
            </div>
            <div class="form-group">
                <label for="antrag-antragsteller">Antragsteller*in</label>
                <input type="text" id="antrag-antragsteller" placeholder="Name der Antragsteller*in">
            </div>
            <div class="form-group">
                <label for="antrag-links">Links (Komma-getrennt)</label>
                <input type="text" id="antrag-links" placeholder="https://beispiel.de, https://link2.de">
            </div>
            <div class="form-group">
                <label for="antrag-empfehlung">Abstimmungsempfehlung</label>
                <select id="antrag-empfehlung">
                        <option value="unbedingt-annehmen">Unbedingt annehmen</option>
                        <option value="annahmeempfehlung">Annahmeempfehlung</option>
                        <option value="neutral">Neutral, besser mit guten ÄA</option>
                        <option value="annahme-mit-aenderungen">Annahme nur mit guten ÄA</option>
                        <option value="ablehnen">Ablehnen</option>
                        <option value="versteckt">versteckt (Info)</option>
                </select>
            </div>
            <button id="antrag-erstellen" class="button"><i class="fas fa-plus"></i> Antrag erstellen</button>
        </div>
    </div>
</main>

<div id="login-modal" class="modal">
    <div class="modal-content">
        <button class="close-modal">&times;</button>
        <h2 class="text-center">Admin Login</h2>
        <div class="form-group">
            <label for="login-username">Benutzername</label>
            <input type="text" id="login-username" placeholder="Admin Benutzername">
        </div>
        <div class="form-group">
            <label for="login-password">Passwort</label>
            <input type="password" id="login-password" placeholder="Passwort">
        </div>
        <button id="login-submit" class="button">Anmelden</button>
    </div>
</div>

<div id="antrag-detail-modal" class="modal">
    <div class="modal-content">
        <button class="close-modal" id="close-antrag-detail-modal">&times;</button>
        <h2 id="detail-antrag-title"></h2>
        <p id="detail-antrag-antragsteller" class="antrag-meta-info"></p>
        <p id="detail-antrag-beschreibung"></p>
        <div id="detail-antrag-links" class="antrag-meta-info"></div>
        <div id="detail-antrag-empfehlung" class="abstimmungsempfehlung" style="margin-top: 1rem;"></div>
    </div>
</div>

<footer style="display: flex; align-items: center; justify-content: center; text-align: center;">
    <img src="img/favicon-32x32.png" alt="Logo" style="height: 64px; margin-right: 8px;">
    <p>Made with ❤️ by Mikko & Aron</p>
</footer>
<script src="js/app.js" defer></script>
</body>
</html>
